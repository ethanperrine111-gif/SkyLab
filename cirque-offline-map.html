<style>
:root{
  --bg:#0F151B; --panel:#161E26; --panel-2:#1D2833; --edge:#2A3844;
  --fg:#E9EEF3; --dim:#8FA0AE; --faint:#5B6975;
  --route:#FF5A1F; --accent:#4EA8DE; --ok:#3FB950; --warn:#D29922;
  --camp:#3FB950; --pass:#D29922; --th:#4EA8DE;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans)}
#map{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--bg)}
body.prof #map{bottom:132px}
.leaflet-container{background:#0A0F14;font-family:var(--sans)}

#ui{position:absolute;top:0;left:0;bottom:0;width:336px;z-index:1002;
  background:var(--panel);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;transition:transform .22s ease;transform:translateX(0)}
body.menu-closed #ui{transform:translateX(-100%)}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:1001;display:none}
#toggle{position:absolute;top:12px;left:348px;z-index:1003;background:var(--panel);
  color:var(--fg);border:1px solid var(--edge);width:44px;height:44px;border-radius:8px;
  cursor:pointer;font-size:18px;transition:left .22s ease;display:grid;place-items:center}
body.menu-closed #toggle{left:12px}
#closep{display:none;position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:8px;
  background:var(--panel-2);border:1px solid var(--edge);color:var(--fg);font-size:17px;cursor:pointer;
  place-items:center;z-index:3}

.hd{padding:15px 18px 13px;border-bottom:1px solid var(--edge)}
.hd h1{margin:0;font-size:15.5px;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.hd .src{margin-top:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  color:var(--ok);text-transform:uppercase}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--edge)}
.fig{padding:10px 8px 11px;text-align:center;border-right:1px solid var(--edge)}
.fig:last-child{border-right:none}
.fig .v{font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--faint);
  text-transform:uppercase;margin-top:3px}

.sec{padding:13px 18px;border-bottom:1px solid var(--edge)}
.sec h2{margin:0 0 9px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.lyr{background:var(--panel-2);border:1px solid var(--edge);color:var(--dim);padding:8px 6px;
  border-radius:5px;cursor:pointer;font-size:11.5px;text-align:center;transition:.12s}
.lyr:hover{border-color:var(--faint);color:var(--fg)}
.lyr.on{background:var(--accent);border-color:var(--accent);color:#06121C;font-weight:600}
.row{display:flex;gap:6px}
.btn{flex:1;background:var(--panel-2);border:1px solid var(--edge);color:var(--fg);padding:9px 8px;
  border-radius:5px;cursor:pointer;font-size:11.5px;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.go{background:var(--accent);border-color:var(--accent);color:#06121C;font-weight:600}
.btn.go:hover{filter:brightness(1.08);color:#06121C}
.btn.stop{background:#3A1D1D;border-color:#6B2B2B;color:#FF8A7A}
select.btn{flex:0 0 88px}
.prog{margin-top:9px;height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:0;background:var(--ok);transition:width .15s}
.stat{margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--dim);line-height:1.5}
.stat b{color:var(--ok);font-weight:500}
.stat.warn b{color:var(--warn)}

.wps{flex:1;overflow-y:auto;padding:4px 10px 18px}
.wps h2{margin:10px 8px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--faint)}
.wp{display:grid;grid-template-columns:20px 1fr auto;gap:10px;align-items:center;
  padding:9px 8px;border-radius:6px;cursor:pointer;transition:.12s}
.wp:hover{background:var(--panel-2)}
.wp.on{background:var(--panel-2);box-shadow:inset 2px 0 0 var(--route)}
.wp .dot{width:11px;height:11px;justify-self:center}
.wp .nm{font-size:13px;line-height:1.3}
.wp .mi{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.wp .el{font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.dot.camp{background:var(--camp);border-radius:2px}
.dot.pass{width:0;height:0;background:none;border-left:6px solid transparent;
  border-right:6px solid transparent;border-bottom:11px solid var(--pass)}
.dot.th{background:var(--th);border-radius:50%}

.note{font-size:11.5px;color:var(--dim);line-height:1.55;margin:8px 0 0}
.note b{color:var(--fg);font-weight:600}

#readout{position:absolute;right:10px;bottom:10px;z-index:1000;background:rgba(15,21,27,.9);
  border:1px solid var(--edge);border-radius:5px;padding:6px 10px;font-family:var(--mono);
  font-size:10.5px;color:var(--dim);backdrop-filter:blur(6px)}
body.prof #readout{bottom:142px}

/* elevation profile */
#profile{position:absolute;left:336px;right:0;bottom:0;height:132px;z-index:999;
  background:var(--panel);border-top:1px solid var(--edge);border-left:1px solid var(--edge);
  display:none;transition:left .22s ease}
body.nopanel #profile{left:0}
body.prof #profile{display:block}
#profile svg{display:block;width:100%;height:132px}
#profile .ax{font-family:var(--mono);font-size:9px;fill:var(--faint)}
#phud{position:absolute;top:7px;right:12px;font-family:var(--mono);font-size:10.5px;
  color:var(--dim);pointer-events:none}
#phud b{color:var(--fg);font-weight:500}

/* markers */
.mk{display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;
  color:#0B0F14;border:2px solid #0B0F14;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.mk.camp{background:var(--camp);width:22px;height:22px;border-radius:4px}
.mk.pass{background:var(--pass);width:22px;height:22px;border-radius:50%}
.mk.th{background:var(--th);width:22px;height:22px;border-radius:50%}
.mk.on{outline:2px solid #fff;transform:scale(1.18)}
.me{background:var(--accent);border:2px solid #fff;border-radius:50%;width:16px;height:16px;
  box-shadow:0 0 0 4px rgba(78,168,222,.3)}
.cursor{background:#fff;border:2px solid var(--route);border-radius:50%;width:13px;height:13px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--fg);border-radius:7px;border:1px solid var(--edge)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--edge)}
.leaflet-popup-content{margin:11px 13px;font-size:12.5px;line-height:1.5}
.leaflet-popup-content h3{margin:0 0 3px;font-size:13.5px}
.leaflet-popup-content .m{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-bottom:6px}
.leaflet-popup-content p{margin:0;color:var(--dim)}
a.leaflet-popup-close-button{color:var(--faint)!important}
.leaflet-control-attribution{background:rgba(15,21,27,.85)!important;color:var(--faint)!important;font-size:9.5px!important}
.leaflet-control-attribution a{color:var(--dim)!important}
.leaflet-bar a{background:var(--panel)!important;color:var(--fg)!important;border-color:var(--edge)!important}
.leaflet-bar a:hover{background:var(--panel-2)!important}
.leaflet-control-scale-line{background:rgba(15,21,27,.85)!important;color:var(--dim)!important;
  border-color:var(--edge)!important;font-family:var(--mono);font-size:10px}
/* Narrow screens: sheet over a full-bleed map. Emitted twice — media query plus
   .force-narrow, which JS sets when the screen is small but the viewport claims
   otherwise (iOS Quick Look previews a downloaded .html at desktop width). */
@media (max-width:899px){
  #ui{width:min(340px,88vw);box-shadow:0 0 46px rgba(0,0,0,.65);transform:translateX(-100%)}
  body.menu-open #ui{transform:translateX(0)}
  #toggle{left:12px;top:12px}
  body.menu-open #scrim{display:block}
  #closep{display:grid}
  #profile{left:0;height:104px}
  #profile svg{height:104px}
  body.prof #map{bottom:104px}
  body.prof #readout{bottom:114px}
  .sec{padding:14px 16px}
  .btn{padding:12px 8px;font-size:12.5px}
  .lyr{padding:12px 6px;font-size:12.5px}
  .wp{padding:12px 8px}
}
body.force-narrow #ui{width:min(340px,88vw);box-shadow:0 0 46px rgba(0,0,0,.65);transform:translateX(-100%)}
body.force-narrow.menu-open #ui{transform:translateX(0)}
body.force-narrow #toggle{left:12px;top:12px}
body.force-narrow.menu-open #scrim{display:block}
body.force-narrow #closep{display:grid}
body.force-narrow #profile{left:0;height:104px}
body.force-narrow #profile svg{height:104px}
body.force-narrow.prof #map{bottom:104px}
body.force-narrow.prof #readout{bottom:114px}
body.force-narrow .sec{padding:14px 16px}
body.force-narrow .btn{padding:12px 8px;font-size:12.5px}
body.force-narrow .lyr{padding:12px 6px;font-size:12.5px}
body.force-narrow .wp{padding:12px 8px}
</style>
</head>
<body class="prof">
<div id="map"></div>

<div id="ui">
  <button id="closep" title="Close menu">&#10005;</button>
  <div class="hd">
    <h1>Washakie Pass Loop to Cirque of the Towers</h1>
    <div class="src">&#10003; Real GPX &middot; 2D &middot; build 5</div>
  </div>
  <div class="figs">
    <div class="fig"><div class="v">36.2</div><div class="k">Miles</div></div>
    <div class="fig"><div class="v">6,610</div><div class="k">Ft gain</div></div>
    <div class="fig"><div class="v">11,863</div><div class="k">Ft high</div></div>
  </div>

  <div class="sec">
    <h2>Basemap</h2>
    <div class="layers" id="layers"></div>
  </div>

  <div class="sec">
    <h2>Offline</h2>
    <div class="row">
      <button class="btn go" id="dl">Save for offline</button>
      <select class="btn" id="zmax">
        <option value="14">to z14</option>
        <option value="15" selected>to z15</option>
        <option value="16">to z16</option>
      </select>
    </div>
    <div class="prog" id="prog"><i></i></div>
    <div class="stat" id="stat"></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="clear">Clear cache</button>
      <button class="btn" id="gpx">Export GPX</button>
    </div>
  </div>

  <div class="sec">
    <h2>Map</h2>
    <div class="row"><button class="btn" id="locate">Show my location</button></div>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="fit">Fit track</button>
      <button class="btn" id="toggleRoute">Hide track</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button class="btn" id="toggleProf">Hide profile</button>
    </div>
    <p class="note">Track is the real recorded GPX. Camps are the four marked in
    the file; passes are the measured high points. Still carry a paper topo.</p>
  </div>

  <div class="wps">
    <h2>Waypoints</h2>
    <div id="wplist"></div>
  </div>
</div>
<div id="scrim"></div>
<button id="toggle" title="Menu">&#9776;</button>
<div id="readout">&mdash;</div>
<div id="profile"><svg id="psvg" preserveAspectRatio="none"></svg><div id="phud"></div></div>

/* ---------- IndexedDB tile store ---------- */
const DB='cirque-tiles', ST='tiles'; let db=null;
const openDB=()=>new Promise(r=>{const q=indexedDB.open(DB,1);
  q.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST)};
  q.onsuccess=e=>{db=e.target.result;r(db)};q.onerror=()=>r(null)});
const tGet=k=>new Promise(r=>{if(!db)return r(null);try{
  const q=db.transaction(ST,'readonly').objectStore(ST).get(k);
  q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const tPut=(k,b)=>new Promise(r=>{if(!db)return r(0);try{
  const q=db.transaction(ST,'readwrite').objectStore(ST).put(b,k);
  q.onsuccess=()=>r(1);q.onerror=()=>r(0)}catch(e){r(0)}});
const tCount=()=>new Promise(r=>{if(!db)return r(0);try{
  const q=db.transaction(ST,'readonly').objectStore(ST).count();
  q.onsuccess=()=>r(q.result);q.onerror=()=>r(0)}catch(e){r(0)}});
const tClear=()=>new Promise(r=>{if(!db)return r();try{
  const q=db.transaction(ST,'readwrite').objectStore(ST).clear();
  q.onsuccess=()=>r();q.onerror=()=>r()}catch(e){r()}});

const OfflineLayer=L.TileLayer.extend({
  createTile:function(coords,done){
    const img=document.createElement('img'); img.alt='';
    L.DomEvent.on(img,'load',L.Util.bind(this._tileOnLoad,this,done,img));
    L.DomEvent.on(img,'error',L.Util.bind(this._tileOnError,this,done,img));
    if(this.options.crossOrigin||this.options.crossOrigin==='')img.crossOrigin='';
    const url=this.getTileUrl(coords);
    tGet(this.options.id+'/'+coords.z+'/'+coords.x+'/'+coords.y)
      .then(b=>{img.src=b?URL.createObjectURL(b):url});
    return img;
  }
});

const line=L.polyline(TRACK,{color:'#FF5A1F',weight:3.6,opacity:.98,lineJoin:'round'});

function applyViewportMode(){
  const scr=(window.screen&&screen.width)?screen.width:9999;
  document.body.classList.toggle('force-narrow', scr<900);
}
const narrow=()=>document.body.classList.contains('force-narrow')||innerWidth<900;
function panelOpen(){
  return narrow()? document.body.classList.contains('menu-open')
                 : !document.body.classList.contains('menu-closed');
}
function setPanel(open){
  const b=document.body.classList;
  if(narrow()){ b.toggle('menu-open',open); b.remove('menu-closed'); }
  else { b.toggle('menu-closed',!open); b.remove('menu-open'); }
  b.toggle('nopanel',!open);
  setTimeout(()=>{map.invalidateSize();drawProfile()},260);
}
/* Close the sheet after anything that changes the map, or the control looks dead. */
function afterMapAction(){ if(narrow()&&panelOpen()) setPanel(false); }
function FIT(){
  const wantLeft=(panelOpen()&&!narrow())?356:26;
  const maxSide=Math.max(10,Math.floor(innerWidth/2)-24);
  map.fitBounds(line.getBounds(),
    {paddingTopLeft:[Math.min(wantLeft,maxSide),26],paddingBottomRight:[Math.min(26,maxSide),26]});
}

const markers=WPS.map((w,i)=>{
  const m=L.marker([w.lat,w.lon],{icon:L.divIcon({className:'',
    html:`<div class="mk ${w.kind}">${w.n}</div>`,iconSize:[22,22],iconAnchor:[11,11]})});
  m.bindPopup(`<h3>${w.name}</h3><div class="m">MI ${w.mi.toFixed(1)} &middot; ${w.ft.toLocaleString()} FT</div><p>${w.note}</p>`);
  m.on('click',()=>select(i)); m.addTo(map); return m;
});

function select(i,pan){
  document.querySelectorAll('.wp').forEach((e,k)=>e.classList.toggle('on',k===i));
  document.querySelectorAll('.mk').forEach((e,k)=>e.classList.toggle('on',k===i));
  if(pan!==false){markers[i].openPopup();map.panTo(markers[i].getLatLng(),{animate:true});}
}

/* ---------- elevation profile ---------- */
const NS='http://www.w3.org/2000/svg';
let PW=1000; const PH=132,PL=44,PR=14,PT=14,PB=22;
const maxMi=PROF[PROF.length-1][0];
let loFt=Infinity,hiFt=-Infinity;
PROF.forEach(p=>{loFt=Math.min(loFt,p[1]);hiFt=Math.max(hiFt,p[1])});
loFt=Math.floor(loFt/500)*500; hiFt=Math.ceil(hiFt/500)*500;
const pxm=mi=>PL+mi/maxMi*(PW-PL-PR);
const pyf=ft=>PT+(1-(ft-loFt)/(hiFt-loFt))*(PH-PT-PB);

function drawProfile(){
  const svg=document.getElementById('psvg');
  PW=Math.max(360,svg.clientWidth||svg.parentNode.clientWidth||1000);
  svg.setAttribute('viewBox',`0 0 ${PW} ${PH}`);
  let h='';
  for(let ft=loFt;ft<=hiFt;ft+=1000){
    const y=pyf(ft);
    h+=`<line x1="${PL}" y1="${y}" x2="${PW-PR}" y2="${y}" stroke="#2A3844" stroke-width="1"/>`;
    h+=`<text class="ax" x="${PL-7}" y="${y+3}" text-anchor="end">${(ft/1000).toFixed(0)}k</text>`;
  }
  for(let mi=0;mi<=maxMi;mi+=6){
    const x=pxm(mi);
    h+=`<line x1="${x}" y1="${PT}" x2="${x}" y2="${PH-PB}" stroke="#2A3844" stroke-width="1" stroke-dasharray="2 4"/>`;
    h+=`<text class="ax" x="${x}" y="${PH-PB+13}" text-anchor="middle">${mi}mi</text>`;
  }
  let d='M '+pxm(PROF[0][0])+' '+pyf(PROF[0][1]);
  PROF.forEach(p=>{d+=` L ${pxm(p[0]).toFixed(1)} ${pyf(p[1]).toFixed(1)}`});
  h+=`<path d="${d} L ${pxm(maxMi)} ${pyf(loFt)} L ${pxm(0)} ${pyf(loFt)} Z" fill="#FF5A1F" opacity=".14"/>`;
  h+=`<path d="${d}" fill="none" stroke="#FF5A1F" stroke-width="1.8"/>`;
  WPS.forEach(w=>{
    const c={camp:'#3FB950',pass:'#D29922',th:'#4EA8DE'}[w.kind];
    h+=`<line x1="${pxm(w.mi)}" y1="${PT}" x2="${pxm(w.mi)}" y2="${PH-PB}" stroke="${c}" stroke-width="1" opacity=".45"/>`;
    h+=`<circle cx="${pxm(w.mi)}" cy="${pyf(w.ft)}" r="3.2" fill="${c}" stroke="#0F151B" stroke-width="1.2"/>`;
  });
  h+=`<line id="pcur" x1="0" y1="${PT}" x2="0" y2="${PH-PB}" stroke="#fff" stroke-width="1" opacity="0"/>`;
  svg.innerHTML=h;
}

let cursor=null;
function onProfileMove(ev){
  const svg=document.getElementById('psvg');
  const r=svg.getBoundingClientRect();
  const cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
  const x=(cx-r.left)/r.width*PW;
  const mi=Math.max(0,Math.min(maxMi,(x-PL)/(PW-PL-PR)*maxMi));
  let best=0,bd=1e9;
  PROF.forEach((p,i)=>{const d=Math.abs(p[0]-mi);if(d<bd){bd=d;best=i}});
  const p=PROF[best];
  document.getElementById('pcur').setAttribute('x1',pxm(p[0]));
  document.getElementById('pcur').setAttribute('x2',pxm(p[0]));
  document.getElementById('pcur').setAttribute('opacity','.75');
  document.getElementById('phud').innerHTML=`MI <b>${p[0].toFixed(1)}</b> &middot; <b>${p[1].toLocaleString()}</b> FT`;
  if(!cursor){cursor=L.marker([p[2],p[3]],{icon:L.divIcon({className:'',
    html:'<div class="cursor"></div>',iconSize:[13,13],iconAnchor:[6.5,6.5]}),
    interactive:false,zIndexOffset:900}).addTo(map);}
  else cursor.setLatLng([p[2],p[3]]);
}
function onProfileLeave(){
  document.getElementById('pcur').setAttribute('opacity','0');
  document.getElementById('phud').innerHTML='';
  if(cursor){map.removeLayer(cursor);cursor=null}
}

/* ---------- UI ---------- */
const $=s=>document.querySelector(s);
$('#layers').innerHTML=Object.entries(LAYERS).map(([k,c])=>`<button class="lyr" data-k="${k}">${c.label}</button>`).join('');
document.querySelectorAll('.lyr').forEach(b=>b.onclick=()=>{setLayer(b.dataset.k);afterMapAction()});

$('#wplist').innerHTML=WPS.map((w,i)=>
  `<div class="wp" data-i="${i}"><div class="dot ${w.kind}"></div>
   <div><div class="nm">${w.name}</div><div class="mi">MI ${w.mi.toFixed(1)}</div></div>
   <div class="el">${w.ft.toLocaleString()}'</div></div>`).join('');
document.querySelectorAll('.wp').forEach(e=>e.onclick=()=>select(+e.dataset.i));

$('#toggle').onclick=()=>setPanel(!panelOpen());
$('#closep').onclick=()=>setPanel(false);
$('#scrim').onclick=()=>setPanel(false);
$('#fit').onclick=()=>{FIT();afterMapAction()};
$('#toggleRoute').onclick=e=>{
  if(map.hasLayer(group)){map.removeLayer(group);e.target.textContent='Show track'}
  else{group.addTo(map);e.target.textContent='Hide track'}
  afterMapAction();};
$('#toggleProf').onclick=e=>{
  document.body.classList.toggle('prof');
  e.target.textContent=document.body.classList.contains('prof')?'Hide profile':'Show profile';
  setTimeout(()=>{map.invalidateSize();drawProfile()},60);};

let meMarker=null,watchId=null;
$('#locate').onclick=()=>{
  if(!navigator.geolocation){setStat('Geolocation unavailable in this browser.',1);return}
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null;
    if(meMarker){map.removeLayer(meMarker);meMarker=null}
    $('#locate').textContent='Show my location';return}
  $('#locate').textContent='Locating...';
  watchId=navigator.geolocation.watchPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];
    if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me"></div>',
      iconSize:[16,16],iconAnchor:[8,8]})}).addTo(map);map.setView(ll,Math.max(map.getZoom(),14))}
    else meMarker.setLatLng(ll);
    $('#locate').textContent='Stop tracking';
    setStat(`Position ${ll[0].toFixed(5)}, ${ll[1].toFixed(5)} &plusmn;${Math.round(p.coords.accuracy)} m`);
  },e=>{$('#locate').textContent='Show my location';watchId=null;
    setStat('Location unavailable: '+e.message,1)},
  {enableHighAccuracy:true,maximumAge:5000,timeout:20000});
};

map.on('mousemove',e=>{$('#readout').textContent=
  `${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}  Z${map.getZoom()}`});
function setStat(h,w){const e=$('#stat');e.innerHTML=h;e.classList.toggle('warn',!!w)}

/* ---------- offline ---------- */
const lon2x=(lo,z)=>Math.floor((lo+180)/360*Math.pow(2,z));
const lat2y=(la,z)=>{const r=la*Math.PI/180;
  return Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*Math.pow(2,z))};
function tileList(z0,z1){
  const b=line.getBounds().pad(0.22),o=[];
  for(let z=z0;z<=z1;z++){
    const x0=lon2x(b.getWest(),z),x1=lon2x(b.getEast(),z);
    const y0=lat2y(b.getNorth(),z),y1=lat2y(b.getSouth(),z);
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)o.push({z,x,y});
  }
  return o;
}
let cancelDL=false;
$('#dl').onclick=async()=>{
  const btn=$('#dl'),prog=$('#prog'),bar=$('#prog i');
  if(btn.dataset.busy==='1'){cancelDL=true;return}
  const zmax=parseInt($('#zmax').value,10)||15;
  const cfg=LAYERS[activeKey];
  const tiles=tileList(11,Math.max(11,Math.min(zmax,cfg.max)));
  if(!tiles.length){setStat('Nothing to download for that zoom range.',1);return}
  btn.dataset.busy='1';btn.textContent='Stop';btn.classList.add('stop');
  cancelDL=false;prog.classList.add('on');
  let done=0,ok=0,fail=0;const q=tiles.slice();
  async function worker(){
    while(q.length&&!cancelDL){
      const t=q.shift(),key=cfg.id+'/'+t.z+'/'+t.x+'/'+t.y;
      if(await tGet(key)){ok++}
      else{
        const url=cfg.url.replace('{z}',t.z).replace('{x}',t.x).replace('{y}',t.y);
        try{const r=await fetch(url,{mode:'cors',cache:'force-cache'});
          if(r.ok){await tPut(key,await r.blob());ok++}else fail++}
        catch(e){fail++}
      }
      done++;
      if(done%4===0||done===tiles.length){
        bar.style.width=(done/tiles.length*100).toFixed(1)+'%';
        setStat(`Saving <b>${cfg.label}</b> &middot; ${done}/${tiles.length}`+(fail?` &middot; ${fail} failed`:''),fail>done*.5);
      }
    }
  }
  await Promise.all(Array.from({length:6},worker));
  btn.dataset.busy='';btn.textContent='Save for offline';btn.classList.remove('stop');
  prog.classList.remove('on');bar.style.width='0';
  const tot=await tCount();
  if(ok===0&&fail>0) setStat(`Could not reach the tile server. Serve this file over <b>http://</b> and retry.`,1);
  else setStat(`Cached <b>${tot}</b> tiles`+(fail?` &middot; ${fail} failed`:'')+`. This area works offline.`);
};
$('#clear').onclick=async()=>{await tClear();setStat('Offline cache cleared.')};
$('#gpx').onclick=()=>{
  const trk=TRACK.map(p=>`<trkpt lat="${p[0]}" lon="${p[1]}"/>`).join('');
  const w=WPS.map(x=>`<wpt lat="${x.lat}" lon="${x.lon}"><name>${x.name}</name><ele>${Math.round(x.ft*0.3048)}</ele></wpt>`).join('');
  const g=`<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Cirque map" xmlns="http://www.topografix.com/GPX/1/1">\n${w}\n<trk><name>Washakie Pass Loop to Cirque of the Towers</name><trkseg>${trk}</trkseg></trk></gpx>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([g],{type:'application/gpx+xml'}));
  a.download='washakie-cirque-loop.gpx';a.click();
};

/* ---------- boot ---------- */
applyViewportMode();
if(narrow()){                        // phone: lead with the map, not the menu
  document.body.classList.add('nopanel');
  document.body.classList.remove('prof');
}
drawProfile();
const psvg=document.getElementById('psvg');
psvg.addEventListener('mousemove',onProfileMove);
psvg.addEventListener('touchmove',onProfileMove,{passive:true});
psvg.addEventListener('mouseleave',onProfileLeave);
let rzT; addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawProfile,150)});
psvg.addEventListener('touchend',onProfileLeave);
if(narrow()) $('#toggleProf').textContent='Show profile';
addEventListener('orientationchange',()=>setTimeout(()=>{applyViewportMode();map.invalidateSize();drawProfile()},300));
addEventListener('resize',()=>applyViewportMode());

openDB().then(async()=>{
  setLayer('topo'); FIT(); select(0,false);
  const n=await tCount();
  setStat(n?`<b>${n}</b> tiles cached &middot; offline ready`
           :'No tiles cached. Press <b>Save for offline</b> while you have signal.');
});
</script>
