<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b3d2e"/>
<title>Preflop Trainer</title>
<style>
  :root{
    --bg:#0b3d2e; --felt:#0f5138; --felt-2:#0a3628;
    --ink:#f5f5f4; --muted:#a7c2b6;
    --card-bg:#fafaf7; --card-ink:#111;
    --red:#c0392b; --gold:#e6c15a;
    --good:#22c55e; --bad:#ef4444;
    --panel:rgba(0,0,0,.35);
    --raise:#16a34a; --call:#2563eb; --threebet:#dc2626; --fold:#3a3a3a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{
    background:
      radial-gradient(ellipse at top,var(--felt) 0%,var(--felt-2) 60%,#071e17 100%);
    min-height:100dvh;
    display:flex;flex-direction:column;
  }
  header{padding:14px 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:600;letter-spacing:.02em}
  header .sub{color:var(--muted);font-size:13px}
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 16px 24px;gap:18px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:13px}
  .stats b{color:var(--ink)}
  .table-wrap{width:100%;max-width:640px;background:var(--panel);border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .mode-tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
  .mode-tabs button{
    appearance:none;border:1px solid rgba(255,255,255,.15);background:transparent;color:var(--muted);
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .mode-tabs button.on{background:var(--gold);color:#111;border-color:transparent}
  .situation{text-align:center;color:var(--muted);font-size:14px;margin-bottom:10px;min-height:38px}
  .position-badge{display:inline-block;padding:3px 10px;border-radius:999px;background:#e6c15a;color:#111;font-weight:700;letter-spacing:.06em}
  .hand{display:flex;justify-content:center;gap:14px;margin:14px 0 20px}
  .card{
    width:96px;height:134px;border-radius:12px;background:var(--card-bg);color:var(--card-ink);
    display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;
    box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.06);
    font-weight:700;
  }
  .card.red{color:var(--red)}
  .card .rank{font-size:26px;line-height:1}
  .card .suit-top{font-size:22px;line-height:1}
  .card .suit-big{font-size:52px;align-self:center;line-height:1}
  .card .bot{transform:rotate(180deg);display:flex;flex-direction:column}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  button.action{
    appearance:none;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;
    cursor:pointer;color:#fff;min-width:120px;
    box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .05s ease;
  }
  button.action:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
  .btn-raise{background:var(--raise)}
  .btn-threebet{background:var(--threebet)}
  .btn-call{background:var(--call)}
  .btn-fold{background:#dc2626}
  .btn-next{background:#2563eb;min-width:180px}
  .feedback{
    min-height:64px;margin-top:16px;padding:12px 14px;border-radius:12px;
    background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);
    text-align:center;font-size:15px;
  }
  .feedback.correct{border-color:rgba(34,197,94,.5)}
  .feedback.wrong{border-color:rgba(239,68,68,.5)}
  .feedback .verdict{font-weight:800;font-size:17px;margin-bottom:2px}
  .feedback .verdict.ok{color:var(--good)}
  .feedback .verdict.no{color:var(--bad)}
  .feedback .detail{color:var(--muted)}
  .toolbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .toolbar button{
    appearance:none;background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.2);
    padding:8px 14px;border-radius:10px;font-size:13px;cursor:pointer;
  }
  .toolbar button:hover{background:rgba(255,255,255,.06)}
  .toolbar label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:6px}
  select{
    background:rgba(0,0,0,.35);color:var(--ink);border:1px solid rgba(255,255,255,.2);
    padding:6px 8px;border-radius:8px;font-size:13px;
  }
  dialog{
    background:#111;color:var(--ink);border:1px solid rgba(255,255,255,.2);border-radius:14px;
    max-width:min(96vw,560px);padding:16px;
  }
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin:0 0 4px;font-size:16px}
  dialog .legend{color:var(--muted);font-size:12px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(13,1fr);gap:2px;font-size:11px;font-weight:600}
  .cell{
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    background:var(--fold);color:#888;border-radius:3px;
  }
  .cell.raise    {background:var(--raise);   color:#fff}
  .cell.threebet {background:var(--threebet);color:#fff}
  .cell.call     {background:var(--call);    color:#fff}
  .grid-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px;flex-wrap:wrap}
  .grid-actions .pct{color:var(--muted);font-size:12px}
  .grid-actions button{
    background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.3);
    padding:6px 12px;border-radius:8px;font-size:13px;cursor:pointer;
  }
  footer{padding:10px 18px 18px;text-align:center;color:var(--muted);font-size:12px}
  @media (max-width:420px){
    .card{width:78px;height:110px}
    .card .rank{font-size:22px}
    .card .suit-big{font-size:42px}
    button.action{min-width:104px;padding:12px 14px;font-size:15px}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Preflop Trainer</h1>
    <div class="sub" id="sub">6-max cash · 100bb</div>
  </div>
  <div class="stats">
    <span>Score: <b id="score">0</b> / <b id="total">0</b></span>
    <span>Accuracy: <b id="acc">—</b></span>
    <span>Streak: <b id="streak">0</b></span>
  </div>
</header>

<main>
  <div class="table-wrap">
    <div class="mode-tabs">
      <button id="mode-rfi" class="on">Open (RFI)</button>
      <button id="mode-bb">BB Defense</button>
    </div>

    <div class="situation" id="situation">—</div>

    <div class="hand" id="hand"></div>

    <div class="actions" id="actions"></div>

    <div class="feedback" id="feedback">Pick an action.</div>

    <div class="toolbar">
      <button id="btn-chart">Show range chart</button>
      <label id="pos-filter-wrap">Position:
        <select id="pos-filter">
          <option value="any">Any</option>
          <option value="UTG">UTG</option>
          <option value="HJ">HJ</option>
          <option value="CO">CO</option>
          <option value="BTN">BTN</option>
          <option value="SB">SB</option>
        </select>
      </label>
      <button id="btn-reset">Reset stats</button>
    </div>
  </div>

  <dialog id="chart-dialog">
    <h3 id="chart-title"></h3>
    <div class="legend" id="chart-legend"></div>
    <div class="grid" id="chart-grid"></div>
    <div class="grid-actions">
      <span class="pct" id="chart-pct"></span>
      <button id="chart-close">Close</button>
    </div>
  </dialog>
</main>

<footer>
  Solver-approximated 6-max 100bb charts. Educational — real GTO play uses mixed strategies.
</footer>

<script>
(() => {
  const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
  const SUITS = [
    {s:'♠', red:false},
    {s:'♥', red:true},
    {s:'♦', red:true},
    {s:'♣', red:false},
  ];

  // ---------- Range expansion ----------
  function expandRange(spec){
    const out = new Set();
    const rIdx = r => RANKS.indexOf(r);
    for(const tok of spec){
      let m = tok.match(/^([2-9TJQKA])\1\+$/);
      if(m){
        const start = rIdx(m[1]);
        for(let i=start;i>=0;i--) out.add(RANKS[i]+RANKS[i]);
        continue;
      }
      m = tok.match(/^([2-9TJQKA])\1-([2-9TJQKA])\2$/);
      if(m){
        const a=rIdx(m[1]), b=rIdx(m[2]);
        const [lo,hi]=[Math.max(a,b),Math.min(a,b)];
        for(let i=lo;i>=hi;i--) out.add(RANKS[i]+RANKS[i]);
        continue;
      }
      m = tok.match(/^([2-9TJQKA])([2-9TJQKA])s\+$/);
      if(m){
        const hi=rIdx(m[1]), start=rIdx(m[2]);
        for(let i=start;i>hi;i--) out.add(m[1]+RANKS[i]+'s');
        continue;
      }
      m = tok.match(/^([2-9TJQKA])([2-9TJQKA])o\+$/);
      if(m){
        const hi=rIdx(m[1]), start=rIdx(m[2]);
        for(let i=start;i>hi;i--) out.add(m[1]+RANKS[i]+'o');
        continue;
      }
      m = tok.match(/^([2-9TJQKA])([2-9TJQKA])s-([2-9TJQKA])([2-9TJQKA])s$/);
      if(m && m[1]===m[3]){
        const hi = rIdx(m[1]);
        const a=rIdx(m[2]), b=rIdx(m[4]);
        const [top,bot]=[Math.min(a,b),Math.max(a,b)];
        for(let i=top;i<=bot;i++){
          if(i!==hi) out.add(m[1]+RANKS[i]+'s');
        }
        continue;
      }
      m = tok.match(/^([2-9TJQKA])([2-9TJQKA])[so]$/);
      if(m){ out.add(tok); continue; }
      console.warn('Bad range token:', tok);
    }
    return out;
  }

  // ---------- Opening (RFI) ranges — 6-max 100bb ----------
  const RFI = {
    UTG: expandRange([
      '22+',
      'ATs+','A5s-A4s',
      'KTs+','QTs+','JTs','T9s','98s','87s','76s','65s',
      'AJo+','KQo'
    ]),
    HJ: expandRange([
      '22+',
      'A2s-A5s','A9s','ATs+',
      'K9s+','Q9s+','J9s+','T8s+','97s+','86s+','75s+','65s','54s',
      'ATo+','KJo+','QJo'
    ]),
    CO: expandRange([
      '22+',
      'A2s-A5s','A6s','A7s','A8s','A9s','ATs+',
      'K6s+','Q8s+','J8s+','T7s+','96s+','86s+','75s+','64s+','54s',
      'A9o+','KTo+','QTo+','JTo'
    ]),
    BTN: expandRange([
      '22+',
      'A2s-A5s','A6s','A7s','A8s','A9s','ATs+',
      'K2s-K5s','K6s','K7s','K8s','K9s','KTs+',
      'Q2s-Q7s','Q8s+',
      'J4s+','T6s+','95s+','85s+','74s+','64s+','53s+','43s',
      'A2o+','K7o+','Q8o+','J8o+','T8o+','97o+','87o','76o'
    ]),
    SB: expandRange([
      '22+',
      'A2s-A5s','A6s','A7s','A8s','A9s','ATs+',
      'K2s-K4s','K5s','K6s','K7s','K8s','K9s','KTs+',
      'Q5s-Q7s','Q8s+',
      'J6s+','T7s+','96s+','86s+','75s+','65s','54s',
      'A2o+','K8o+','Q9o+','J9o+','T9o','98o'
    ]),
  };

  // ---------- BB defense vs each opener ----------
  // Each hand is one of: '3bet' | 'call' | 'fold' (fold implicit — everything not listed)
  const BB_DEF = {
    UTG: {
      threebet: expandRange([
        'TT+','AKs','AKo','AQs','A5s','A4s'
      ]),
      call: expandRange([
        '22-99',
        'AJs','ATs','A9s','A8s','A7s','A6s','A3s','A2s',
        'KJs','KTs','K9s','K8s','K7s',
        'QJs','QTs','Q9s','Q8s',
        'JTs','J9s','J8s',
        'T9s','T8s','98s','97s','87s','86s','76s','75s','65s','54s',
        'AQo','AJo','ATo','KQo','KJo','QJo'
      ]),
    },
    HJ: {
      threebet: expandRange([
        '99+','AKs','AKo','AQs','AJs','KQs','A5s','A4s','A3s'
      ]),
      call: expandRange([
        '22-88',
        'ATs','A9s','A8s','A7s','A6s','A2s',
        'KJs','KTs','K9s','K8s',
        'QJs','QTs','Q9s',
        'JTs','J9s','T9s','T8s','98s','97s','87s','86s','76s','75s','65s','54s',
        'AQo','AJo','ATo','KQo','KJo','KTo','QJo','QTo','JTo'
      ]),
    },
    CO: {
      threebet: expandRange([
        '88+','AJs+','AQo+','KQs','A5s','A4s','A3s','A2s'
      ]),
      call: expandRange([
        '22-77',
        'ATs','A9s','A8s','A7s','A6s',
        'KJs','KTs','K9s','K8s','K7s',
        'QJs','QTs','Q9s','Q8s',
        'JTs','J9s','J8s','T9s','T8s','T7s',
        '98s','97s','96s','87s','86s','76s','75s','65s','64s','54s','53s',
        'AJo','ATo','A9o','KQo','KJo','KTo','QJo','QTo','JTo','T9o'
      ]),
    },
    BTN: {
      threebet: expandRange([
        '77+','ATs+','AQo+','KQs','KJs','QJs',
        'A2s-A5s','K5s','K6s','K7s'
      ]),
      call: expandRange([
        '22-66',
        'A9s','A8s','A7s','A6s',
        'KTs','K9s','K8s','K4s','K3s','K2s',
        'QTs','Q9s','Q8s','Q7s','Q6s','Q5s',
        'JTs','J9s','J8s','J7s',
        'T9s','T8s','T7s','98s','97s','96s','87s','86s','85s','76s','75s','65s','64s','54s','53s',
        'AJo','ATo','A9o','A8o','A7o','A6o','A5o','A4o','A3o','A2o',
        'KQo','KJo','KTo','K9o','QJo','QTo','Q9o','JTo','J9o','T9o','98o'
      ]),
    },
    SB: {
      threebet: expandRange([
        '77+','ATs+','AJo+','KQs','KJs','QJs',
        'A2s-A5s','K7s','K8s','K9s'
      ]),
      call: expandRange([
        '22-66',
        'A9s','A8s','A7s','A6s',
        'KTs','K6s','K5s','K4s','K3s','K2s',
        'QTs','Q9s','Q8s','Q7s','Q6s',
        'JTs','J9s','J8s','J7s',
        'T9s','T8s','T7s','98s','97s','96s','87s','86s','76s','75s','65s','54s','53s',
        'ATo','A9o','A8o','A7o','A6o','A5o','A4o','A3o','A2o',
        'KQo','KJo','KTo','K9o','QJo','QTo','Q9o','JTo','J9o','T9o','98o'
      ]),
    },
  };

  // Correct action lookup for BB defense
  function bbDefAction(opener, code){
    const r = BB_DEF[opener];
    if(r.threebet.has(code)) return '3bet';
    if(r.call.has(code))     return 'call';
    return 'fold';
  }

  // ---------- State ----------
  const state = {
    mode: 'rfi',           // 'rfi' | 'bb'
    hand: null,
    position: null,        // in RFI mode: hero's seat; in BB mode: opener's seat
    answered: false,
    score: 0, total: 0, streak: 0,
    posFilter: 'any',
  };

  // ---------- Card helpers ----------
  function handCode(c1, c2){
    const i1 = RANKS.indexOf(c1.rank), i2 = RANKS.indexOf(c2.rank);
    const hi = i1 < i2 ? c1 : c2;
    const lo = i1 < i2 ? c2 : c1;
    if(hi.rank === lo.rank) return hi.rank + lo.rank;
    return hi.rank + lo.rank + (hi.suit === lo.suit ? 's' : 'o');
  }
  function dealHand(){
    const a = { rank: RANKS[Math.floor(Math.random()*13)],
                suit: SUITS[Math.floor(Math.random()*4)] };
    let b;
    do{
      b = { rank: RANKS[Math.floor(Math.random()*13)],
            suit: SUITS[Math.floor(Math.random()*4)] };
    } while(a.rank===b.rank && a.suit.s===b.suit.s);
    const [c1,c2] = RANKS.indexOf(a.rank) <= RANKS.indexOf(b.rank) ? [a,b] : [b,a];
    return { c1, c2, code: handCode(a,b) };
  }
  function renderCard(c){
    const color = c.suit.red ? ' red' : '';
    const r = c.rank === 'T' ? '10' : c.rank;
    return `<div class="card${color}">
      <div><div class="rank">${r}</div><div class="suit-top">${c.suit.s}</div></div>
      <div class="suit-big">${c.suit.s}</div>
      <div class="bot"><div class="rank">${r}</div><div class="suit-top">${c.suit.s}</div></div>
    </div>`;
  }
  function prettyCode(code){ return code; }

  function pickPosition(){
    const positions = ['UTG','HJ','CO','BTN','SB'];
    if(state.posFilter !== 'any') return state.posFilter;
    return positions[Math.floor(Math.random()*positions.length)];
  }

  function updateStats(){
    document.getElementById('score').textContent = state.score;
    document.getElementById('total').textContent = state.total;
    document.getElementById('streak').textContent = state.streak;
    document.getElementById('acc').textContent =
      state.total ? Math.round(100*state.score/state.total)+'%' : '—';
  }

  // ---------- Round flow ----------
  function newHand(){
    state.hand = dealHand();
    state.position = pickPosition();
    state.answered = false;

    const sit = document.getElementById('situation');
    if(state.mode === 'rfi'){
      sit.innerHTML = `Folded to you in the <span class="position-badge">${state.position}</span>. What's your action?`;
    } else {
      sit.innerHTML = `<span class="position-badge">${state.position}</span> opens 2.5bb. Everyone folds. You're in the <span class="position-badge">BB</span>. Action?`;
    }
    document.getElementById('hand').innerHTML =
      renderCard(state.hand.c1) + renderCard(state.hand.c2);
    document.getElementById('feedback').className = 'feedback';
    document.getElementById('feedback').innerHTML =
      `Hand: <b>${prettyCode(state.hand.code)}</b>. Choose an action.`;
    renderActions('choose');
  }

  function answer(action){
    if(state.answered) return;
    state.answered = true;
    let correct, correctAction, extra = '';
    if(state.mode === 'rfi'){
      const shouldRaise = RFI[state.position].has(state.hand.code);
      correctAction = shouldRaise ? 'raise' : 'fold';
      correct = (action === correctAction);
      extra = shouldRaise
        ? `in the ${state.position} opening range`
        : `not in the ${state.position} opening range`;
    } else {
      correctAction = bbDefAction(state.position, state.hand.code);
      correct = (action === correctAction);
      extra = `vs ${state.position} open`;
    }
    state.total += 1;
    if(correct){ state.score += 1; state.streak += 1; }
    else{ state.streak = 0; }
    updateStats();

    const labelMap = {raise:'Raise', fold:'Fold', call:'Call', '3bet':'3-Bet'};
    const fb = document.getElementById('feedback');
    fb.className = 'feedback ' + (correct ? 'correct' : 'wrong');
    fb.innerHTML =
      `<div class="verdict ${correct?'ok':'no'}">${correct?'Correct':'Incorrect'}</div>` +
      `<div class="detail">${prettyCode(state.hand.code)}: <b>${labelMap[correctAction]}</b> — ${extra}.</div>`;
    renderActions('next');
  }

  function renderActions(mode){
    const el = document.getElementById('actions');
    if(mode === 'choose'){
      if(state.mode === 'rfi'){
        el.innerHTML =
          `<button class="action btn-raise" id="a-raise">Raise</button>
           <button class="action btn-fold"  id="a-fold">Fold</button>`;
        document.getElementById('a-raise').onclick = () => answer('raise');
        document.getElementById('a-fold').onclick  = () => answer('fold');
      } else {
        el.innerHTML =
          `<button class="action btn-threebet" id="a-3bet">3-Bet</button>
           <button class="action btn-call"     id="a-call">Call</button>
           <button class="action btn-fold"     id="a-fold">Fold</button>`;
        document.getElementById('a-3bet').onclick = () => answer('3bet');
        document.getElementById('a-call').onclick = () => answer('call');
        document.getElementById('a-fold').onclick = () => answer('fold');
      }
    } else {
      el.innerHTML = `<button class="action btn-next" id="a-next">Next hand →</button>`;
      document.getElementById('a-next').onclick = newHand;
    }
  }

  // ---------- Chart ----------
  function openChart(){
    const dlg = document.getElementById('chart-dialog');
    const pos = state.position || 'UTG';
    const grid = document.getElementById('chart-grid');
    grid.innerHTML = '';
    let raiseCombos = 0, threebetCombos = 0, callCombos = 0;
    const weight = code =>
      code.length===2 ? 6 : (code.endsWith('s') ? 4 : 12);
    for(let r=0;r<13;r++){
      for(let c=0;c<13;c++){
        let code;
        if(r===c) code = RANKS[r]+RANKS[c];
        else if(r<c) code = RANKS[r]+RANKS[c]+'s';
        else code = RANKS[c]+RANKS[r]+'o';
        let cls = 'fold';
        if(state.mode === 'rfi'){
          if(RFI[pos].has(code)){ cls = 'raise'; raiseCombos += weight(code); }
        } else {
          if(BB_DEF[pos].threebet.has(code)){ cls='threebet'; threebetCombos += weight(code); }
          else if(BB_DEF[pos].call.has(code)){ cls='call'; callCombos += weight(code); }
        }
        grid.innerHTML += `<div class="cell ${cls}">${code}</div>`;
      }
    }
    const title = document.getElementById('chart-title');
    const legend = document.getElementById('chart-legend');
    const pct = document.getElementById('chart-pct');
    if(state.mode === 'rfi'){
      title.textContent = `${pos} opening range`;
      legend.textContent = 'Green = raise · Grey = fold · Suited above the diagonal, offsuit below, pairs on it';
      pct.textContent = `${pos} opens ${(100*raiseCombos/1326).toFixed(1)}% of hands`;
    } else {
      title.textContent = `BB defense vs ${pos} open`;
      legend.textContent = 'Red = 3-bet · Blue = call · Grey = fold';
      pct.textContent = `Defend ${((100*(threebetCombos+callCombos))/1326).toFixed(1)}% · 3-bet ${(100*threebetCombos/1326).toFixed(1)}% · call ${(100*callCombos/1326).toFixed(1)}%`;
    }
    if(typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open','');
  }

  // ---------- Mode switching ----------
  function setMode(m){
    state.mode = m;
    document.getElementById('mode-rfi').classList.toggle('on', m==='rfi');
    document.getElementById('mode-bb').classList.toggle('on',  m==='bb');
    document.getElementById('sub').textContent =
      m === 'rfi' ? '6-max cash · 100bb · Raise-First-In'
                  : '6-max cash · 100bb · BB Defense';
    // reset stats when switching modes to avoid confusing tallies
    state.score = state.total = state.streak = 0;
    updateStats();
    newHand();
  }

  // ---------- Wire up ----------
  document.getElementById('mode-rfi').onclick = () => setMode('rfi');
  document.getElementById('mode-bb').onclick  = () => setMode('bb');
  document.getElementById('btn-chart').onclick = openChart;
  document.getElementById('chart-close').onclick = () =>
    document.getElementById('chart-dialog').close();
  document.getElementById('pos-filter').onchange = (e) => {
    state.posFilter = e.target.value;
    newHand();
  };
  document.getElementById('btn-reset').onclick = () => {
    state.score = state.total = state.streak = 0;
    updateStats(); newHand();
  };

  // keyboard: RFI => R/F; BB => T/C/F; Space/Enter = next
  document.addEventListener('keydown', (e) => {
    if(e.repeat) return;
    const k = e.key.toLowerCase();
    if(!state.answered){
      if(state.mode === 'rfi'){
        if(k==='r') answer('raise');
        else if(k==='f') answer('fold');
      } else {
        if(k==='t' || k==='3') answer('3bet');
        else if(k==='c') answer('call');
        else if(k==='f') answer('fold');
      }
    } else {
      if(k===' '||k==='enter') newHand();
    }
  });

  updateStats();
  newHand();
})();
</script>
</body>
</html>
